name: 🎲 更新六合彩資料

on:
  schedule:
    # 每天香港時間 22:30 自動執行（UTC 14:30）
    - cron: '30 14 * * *'
  workflow_dispatch:
    # 也可以在 GitHub Actions 頁面手動觸發

permissions:
  contents: write

# 同一時間只跑一個更新，避免兩次 push 互相衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🧪 Run tests
        run: python -m unittest discover -s tests

      - name: 🕷️ Scrape & build
        run: python build_site.py

      - name: 🚀 Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html marksix_all_draws.json marksix_compact.json
          git diff --staged --quiet || git commit -m "🔄 自動更新：$(date +%Y-%m-%d)"
          git push
